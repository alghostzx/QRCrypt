name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Prepare release signing keystore (when secrets are available)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/qrcrypt-release.jks
            chmod 600 keystore/qrcrypt-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not configured; building unsigned release APK."
          fi

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version_name=1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && 'keystore/qrcrypt-release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK security & integrity
        env:
          IS_SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)"
          export PATH="${BUILD_TOOLS_DIR}:${PATH}"

          if [ "$IS_SIGNED" = "true" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            APK_OUT="dist/QRCrypt-${TAG}.apk"
          else
            APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            APK_OUT="dist/QRCrypt-${TAG}-unsigned.apk"
          fi

          mkdir -p dist
          cp "$APK_SRC" "$APK_OUT"

          echo "==> Checking APK permissions (must NOT include INTERNET)..."
          PERMS="$(aapt2 dump permissions "$APK_OUT")"
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::android.permission.INTERNET was found in the compiled APK!"
            exit 1
          fi

          echo "==> Checking 16KB page-size alignment..."
          zipalign -c -P 16 4 "$APK_OUT"

          if [ "$IS_SIGNED" = "true" ]; then
            echo "==> Verifying APK signature..."
            apksigner verify --verbose "$APK_OUT"
          fi

          (cd dist && sha256sum "$(basename "$APK_OUT")" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -lh "$APK_OUT"

      - name: Cleanup keystore from runner
        if: always()
        run: rm -rf keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrcrypt-apk-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/QRCrypt-${TAG}.apk" \
            "dist/SHA256SUMS.txt" \
            --title "QRCrypt ${TAG}" \
            --generate-notes
